[project]
name = "soccer-analysis"
version = "0.0.1"
description = "AI-powered soccer match analysis for amateur, youth, and high school teams."
readme = "README.md"
# 3.12 everywhere: AMD's PyTorch build for Windows (RX 7900 XTX machine) requires 3.12.
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
# Runtime dependencies of src/: permissive licenses ONLY (MIT, BSD, Apache-2.0).
# See docs/licensing.md. The YOLO learning baseline (AGPL) has its own separate
# environment defined in baseline/pyproject.toml -- never add ultralytics here.
dependencies = [
    "rfdetr",               # detector (Apache-2.0; use only the Apache-licensed sizes, Nano-Large)
    "trackers",             # tracker, e.g. ByteTrack (Apache-2.0)
    "supervision>=0.31",    # MIT; >=0.31 required by trackers
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soccer_analysis"]

[project]
name = "soccer-analysis"
version = "0.0.1"
description = "AI-powered soccer match analysis for amateur, youth, and high school teams."
readme = "README.md"
# 3.12 everywhere: AMD's PyTorch build for Windows (RX 7900 XTX machine) requires 3.12.
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
# Runtime dependencies of src/: permissive licenses ONLY (MIT, BSD, Apache-2.0).
# See docs/licensing.md.
dependencies = []

[dependency-groups]
# LEARNING BASELINE ONLY: Roboflow's soccer example (Ultralytics YOLO, AGPL-3.0).
# Never import any of these from src/ and never ship them. Dependency groups are
# not part of the published package metadata, so they don't ship with it.
baseline = [
    "sports @ git+https://github.com/roboflow/sports.git@21a7d2b2ce77b047fac93527aed6dd08c69d85f3",
    "ultralytics",
    "gdown",
    # The example breaks on newer supervision:
    #   >=0.28: Detections.merge() of all-empty detections returns tracker_id=None -> crash on frame 1
    #   >=0.31: sv.ByteTrack removed (moved to the separate `trackers` package)
    "supervision>=0.26,<0.28",
]

[tool.uv]
default-groups = ["baseline"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soccer_analysis"]
